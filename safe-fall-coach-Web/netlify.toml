[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Supabase anon key and public URLs are intentionally in the client bundle,
  # so tell Netlify's secret scanner not to fail the build on these variables.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_ACTIVE_LEARNING_API_URL,VITE_ACCESS_EMAIL_WEBHOOK_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
